<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>NomadaApp</title>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="NomadaApp.styles.css" />
    <link rel="icon" href="data:,">
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">Loading...</div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script>
        window.playAudio = function (id) {
            var audio = document.getElementById(id);
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(function (e) { console.log("Bloqueado: ", e); });
            }
        };

        window.unlockAudio = function () {
            // Truco para engañar al celular y que nos dé permiso de hacer ruido
            ['audio-beep', 'audio-go', 'audio-medio'].forEach(id => {
                let a = document.getElementById(id);
                if (a) { a.play().then(() => a.pause()).catch(() => { }); }
            });
        };
    </script>
</body>

</html>
